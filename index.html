<!DOCTYPE html>
<html>
<head>
    <title>Search</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 150px;
        }

        h1 {
            font-size: 40px;
        }

        .search-box {
            width: 400px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 16px;
        }

        .button {
            margin-top: 20px;
            padding: 10px 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>My Search</h1>

    <form action="https://formsubmit.co/loshinicsl@gmail.com" method="POST">

        <input
            class="search-box"
            type="text"
            name="user_text"
            placeholder="Search..."
            required
        >
        
        <br>

        <button class="button" type="submit">
            Submit
        </button>

    </form>

</body>
</html>
